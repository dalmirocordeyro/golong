# Regenera el sitio con datos frescos y lo publica en Cloudflare.
# Corre cada 15 minutos en horario de mercado, cada hora el resto del tiempo y en cada push.
# Nota: GitHub pausa los workflows programados si el repo pasa 60 días sin cambios.
# Te avisa por mail; se reactivan con un clic en la pestaña Actions o con cualquier commit.
name: Actualizar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Horas en UTC (Argentina = UTC-3)
    - cron: '*/15 12-21 * * 1-5'   # lun a vie, 9:00 a 18:45 hora argentina
    - cron: '0 0-11,22-23 * * 1-5' # lun a vie, resto del día, cada hora
    - cron: '0 */2 * * 0,6'        # fines de semana, cada 2 horas (dólar cripto)

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }} # opcional
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generar sitio con datos actuales
        run: npm run build

      # Si faltan las credenciales, este paso falla y dice cuál, en vez de
      # saltear la publicación en silencio y dejar el sitio con datos viejos.
      # El token va sí o sí como "secret"; el Account ID puede ir como secret
      # o como variable (no es un dato sensible).
      - name: Revisar credenciales de Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          falta=0
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Falta CLOUDFLARE_API_TOKEN. Cargalo en Settings > Secrets and variables > Actions, pestaña Secrets, con ese nombre exacto."
            falta=1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Falta CLOUDFLARE_ACCOUNT_ID. Puede ir como secret o como variable, con ese nombre exacto."
            falta=1
          fi
          [ "$falta" = 0 ] || exit 1
          echo "Credenciales presentes. Token de ${#CF_TOKEN} caracteres, cuenta ${CF_ACCOUNT:0:6}..."

      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Confirmar publicación
        run: echo "::notice::Publicado. Los datos del sitio quedan con la fecha de este build."
