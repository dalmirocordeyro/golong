# Regenera el sitio con datos frescos y lo publica en Cloudflare.
# Corre cada 15 minutos en horario de mercado, cada hora el resto del tiempo y en cada push.
# Nota: GitHub pausa los workflows programados si el repo pasa 60 días sin cambios.
# Te avisa por mail; se reactivan con un clic en la pestaña Actions o con cualquier commit.
name: Actualizar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Horas en UTC (Argentina = UTC-3)
    - cron: '*/15 12-21 * * 1-5'   # lun a vie, 9:00 a 18:45 hora argentina
    - cron: '0 0-11,22-23 * * 1-5' # lun a vie, resto del día, cada hora
    - cron: '0 */2 * * 0,6'        # fines de semana, cada 2 horas (dólar cripto)

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }} # opcional
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generar sitio con datos actuales
        run: npm run build

      # Si faltan los secrets, este paso falla y GitHub te avisa por mail.
      # Antes se salteaba en silencio y el sitio quedaba con datos viejos.
      - name: Revisar credenciales de Cloudflare
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Faltan CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID en Settings > Secrets and variables > Actions. Sin eso el sitio no se publica."
            exit 1
          fi

      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Confirmar publicación
        run: echo "::notice::Publicado. Los datos del sitio quedan con la fecha de este build."
