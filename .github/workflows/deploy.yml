# Regenera el sitio con datos frescos y lo publica en Cloudflare.
# Corre cada 15 minutos en horario de mercado, cada hora el resto del tiempo y en cada push.
name: Actualizar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Horas en UTC (Argentina = UTC-3)
    - cron: '*/15 12-21 * * 1-5'   # lun a vie, 9:00 a 18:45 hora argentina
    - cron: '0 0-11,22-23 * * 1-5' # lun a vie, resto del día, cada hora
    - cron: '0 */2 * * 0,6'        # fines de semana, cada 2 horas (dólar cripto)

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # para el keepalive (GitHub pausa los cron sin actividad en 60 días)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }} # opcional
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generar sitio con datos actuales
        run: npm run build

      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Mantener activos los cron
        if: github.event_name == 'schedule'
        uses: gautamkrishnar/keepalive-workflow@v2
        continue-on-error: true
